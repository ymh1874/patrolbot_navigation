# config/nav2_params.yaml
# Consolidated Navigation2 Parameters for Pioneer PatrolBot (ROS 2 Jazzy)
# Updated with legacy CMU-Q kinematic and footprint data adopted from Professor Eduardo 

amcl:
  ros__parameters:
    use_sim_time: False
    alpha1: 0.2
    alpha2: 0.1
    alpha3: 0.2
    alpha4: 0.1
    base_frame_id: "base_link"
    global_frame_id: "map"
    odom_frame_id: "odom"
    scan_topic: "/scan"
    max_beams: 90
    max_particles: 5000
    min_particles: 500
    pf_err: 0.05
    pf_z: 0.99
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    update_min_a: 0.1
    update_min_d: 0.1
    laser_likelihood_max_dist: 1.0
    laser_model_type: "likelihood_field"
    z_hit: 0.7
    z_rand: 0.3
    sigma_hit: 0.02

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 5.0
      global_frame: "odom"
      robot_base_frame: "base_link"
      use_sim_time: False
      rolling_window: True
      width: 4
      height: 4
      resolution: 0.05
      # CRITICAL FIX: Using exact legacy rectangular footprint instead of generic radius
      footprint: "[[-0.40, -0.32], [-0.40, 0.32], [0.50, 0.32], [0.50, -0.32]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          obstacle_max_range: 2.5
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 10.0
        inflation_radius: 0.55

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.5
      publish_frequency: 2.0
      global_frame: "map"
      robot_base_frame: "base_link"
      use_sim_time: False
      resolution: 0.05
      footprint: "[[-0.40, -0.32], [-0.40, 0.32], [0.50, 0.32], [0.50, -0.32]]"
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          obstacle_max_range: 2.5
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 10.0
        inflation_radius: 0.55

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] 
    controller_plugins: ["FollowPath"]
    
    Remap:
      cmd_vel: "/cmd_vel_nav"

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      # Injected Legacy Kinematics
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.8
      max_vel_y: 0.0
      max_vel_theta: 0.8
      min_speed_xy: 0.03
      max_speed_xy: 0.8
      min_speed_theta: 0.01
      acc_lim_x: 0.7
      acc_lim_theta: 2.0
      acc_lim_y: 0.0